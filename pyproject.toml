[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-mind"
version = "0.1.0"
description = "Mahjong AI model with event streaming infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "kafka-python>=3.0.11",
    "httpx>=0.28.0",
    "mahjong>=0.1.0",
]

[tool.ruff.lint]
ignore = ["UP040"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
