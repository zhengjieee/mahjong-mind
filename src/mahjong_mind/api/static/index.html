<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahjongMind Game Viewer</title>
    <style>
        :root {
            --felt: #0f6b4f;
            --felt-dark: #0a5340;
            --tile-face: #fdfcf7;
            --tile-edge: #d8d2c0;
            --tile-side: #e8b04b;
            --ink: #2b2b2b;
            --red: #c0392b;
            --panel: #ffffff;
            --muted: #8a8a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1c2733;
            color: var(--ink);
            min-height: 100vh;
            padding: 16px;
        }

        .layout {
            max-width: 1500px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 16px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border-radius: 10px;
            padding: 16px;
        }

        h2 {
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* ---- header ---- */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            color: #e8eef5;
        }

        .header h1 { font-size: 20px; font-weight: 700; }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a9bdd0;
        }

        .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; }
        .dot.connected { background: #22c55e; }

        /* ---- the table ---- */

        .table {
            position: relative;
            aspect-ratio: 1 / 1;
            max-height: 74vh;
            margin: 0 auto;
            background:
                radial-gradient(circle at 50% 45%, var(--felt) 0%, var(--felt-dark) 78%);
            border: 10px solid #4a2f1b;
            border-radius: 14px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
            grid-template-areas:
                ".    top    ."
                "left center right"
                ".    bottom .";
            padding: 10px;
            gap: 4px;
        }

        .seat { display: flex; align-items: center; justify-content: center; }
        .seat-top { grid-area: top; }
        .seat-bottom { grid-area: bottom; }
        .seat-left { grid-area: left; }
        .seat-right { grid-area: right; }

        /* Each river faces the middle, so opposing seats are turned around. */
        .seat-top .seat-inner { transform: rotate(180deg); }
        .seat-left .seat-inner { transform: rotate(90deg); }
        .seat-right .seat-inner { transform: rotate(-90deg); }

        .seat-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nameplate {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(0, 0, 0, 0.34);
            color: #f2f6fa;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .nameplate.acting {
            background: #f4c430;
            color: #3a2c05;
            font-weight: 700;
        }

        .seat-wind {
            font-weight: 700;
            font-size: 13px;
        }

        .score { opacity: 0.85; font-variant-numeric: tabular-nums; }

        .riichi-stick {
            width: 26px;
            height: 4px;
            border-radius: 2px;
            background: #fff;
            position: relative;
        }

        .riichi-stick::after {
            content: "";
            position: absolute;
            inset: 0;
            margin: auto;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--red);
        }

        .river {
            display: grid;
            grid-template-columns: repeat(6, auto);
            gap: 2px;
            justify-content: center;
            min-height: 20px;
        }

        .melds { display: flex; gap: 6px; }
        .meld { display: flex; gap: 1px; }

        /* ---- centre of the table ---- */

        .center {
            grid-area: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #eaf3ee;
        }

        .round-box {
            background: rgba(0, 0, 0, 0.38);
            border-radius: 10px;
            padding: 12px 22px;
            text-align: center;
            min-width: 168px;
        }

        .round-name { font-size: 26px; font-weight: 700; letter-spacing: 0.04em; }

        .round-meta {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
        }

        .dora-strip { display: flex; align-items: center; gap: 6px; }
        .dora-strip .label { font-size: 11px; text-transform: uppercase; opacity: 0.75; }

        /* ---- tiles ---- */

        .tile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 32px;
            background: linear-gradient(#fff 60%, var(--tile-face));
            border: 1px solid var(--tile-edge);
            border-bottom: 3px solid var(--tile-side);
            border-radius: 3px;
            font-size: 21px;
            line-height: 1;
            color: var(--ink);
            user-select: none;
        }

        .tile.red { color: var(--red); }

        /* The tile that was just played. */
        .tile.latest {
            outline: 2px solid #f4c430;
            outline-offset: 1px;
        }

        /* Turned sideways in the river to mark the riichi declaration. */
        .tile.sideways { transform: rotate(90deg); }

        .tile.called { opacity: 0.85; border-bottom-color: #b98a2f; }

        .tile.back {
            background: linear-gradient(#3f7d68, #2c5c4c);
            border-color: #244b3e;
            border-bottom-color: #1d3d33;
            color: transparent;
        }

        .tile.lg { width: 34px; height: 46px; font-size: 30px; }

        /* ---- hand ---- */

        .hand-panel { margin-top: 14px; }

        .hand-owner {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .hand { display: flex; gap: 3px; flex-wrap: wrap; align-items: flex-end; }
        .hand .drawn { margin-left: 14px; }

        /* ---- predictions ---- */

        .prediction {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .prediction:last-child { border-bottom: none; }
        .prediction .bar { flex: 1; height: 7px; background: #eceef1; border-radius: 4px; }
        .prediction .fill { height: 100%; border-radius: 4px; background: #f59e0b; }
        .prediction .pct {
            font-size: 12px;
            color: var(--muted);
            width: 44px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .prediction.chosen .fill { background: #22c55e; }

        .outcome {
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
            min-height: 16px;
        }

        /* ---- picker and transport ---- */

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: var(--muted);
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        select {
            padding: 5px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            background: #fff;
        }

        .game-list {
            max-height: 190px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 6px;
        }

        .game-item {
            padding: 7px 10px;
            font-size: 11px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            border-bottom: 1px solid #f4f4f4;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .game-item:last-child { border-bottom: none; }
        .game-item:hover { background: #eef4ff; }
        .game-item.active { background: #e0e9ff; font-weight: 700; }

        .badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 9px;
            background: #fef3c7;
            color: #92400e;
        }

        .list-empty { padding: 16px; text-align: center; color: #bbb; font-size: 12px; }

        .transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .btn {
            padding: 7px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover:not(:disabled) { background: #f5f6f8; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-primary { background: #3b5bdb; border-color: #3b5bdb; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #354fc4; }
        .btn-danger { border-color: #f2b8b5; color: #b3261e; }

        .waiting {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cfe3d9;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 1100px) {
            .layout { grid-template-columns: minmax(0, 1fr); }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div>
            <div class="header">
                <h1>🀄︎ MahjongMind Game Viewer</h1>
                <div class="status">
                    <span class="dot" id="dot"></span>
                    <span id="connectionText">Connecting…</span>
                    <span id="gameStatusText"></span>
                </div>
            </div>

            <div class="table" id="table">
                <div class="seat seat-top"><div class="seat-inner" id="seat-2"></div></div>
                <div class="seat seat-left"><div class="seat-inner" id="seat-3"></div></div>
                <div class="center" id="center"></div>
                <div class="seat seat-right"><div class="seat-inner" id="seat-1"></div></div>
                <div class="seat seat-bottom"><div class="seat-inner" id="seat-0"></div></div>
                <div class="waiting" id="waiting">
                    Pick a recorded game to begin.
                </div>
            </div>

            <div class="panel hand-panel" id="handPanel" style="display:none">
                <h2>Hand</h2>
                <div class="hand-owner" id="handOwner"></div>
                <div class="hand" id="hand"></div>
            </div>
        </div>

        <div>
            <div class="panel" style="margin-bottom:16px">
                <h2>Model predictions</h2>
                <div id="predictions"><div class="list-empty">Waiting for a draw…</div></div>
                <div class="outcome" id="outcome"></div>
            </div>

            <div class="panel">
                <h2>Choose a game</h2>
                <div class="controls">
                    <label for="yearSelect">Year</label>
                    <select id="yearSelect"></select>
                    <label for="modeSelect">Mode</label>
                    <select id="modeSelect">
                        <option value="step" selected>Step</option>
                        <option value="auto">Auto</option>
                    </select>
                    <label for="speedSelect" id="speedLabel" style="display:none">Speed</label>
                    <select id="speedSelect" style="display:none">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="2">2x</option>
                        <option value="4">4x</option>
                    </select>
                </div>

                <div class="transport" id="transport" style="display:none">
                    <button class="btn btn-primary" id="nextBtn">Next event ▶</button>
                    <button class="btn" id="pauseBtn" style="display:none">Pause</button>
                    <button class="btn btn-danger" id="stopBtn">Stop</button>
                </div>

                <h2 style="margin-top:14px">Playing now</h2>
                <div class="game-list" id="liveList">
                    <div class="list-empty">No games playing</div>
                </div>

                <h2 style="margin-top:14px">Recorded</h2>
                <div class="game-list" id="recordedList">
                    <div class="list-empty">Loading…</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Unicode has a tile for every face, so no image assets are needed.
        // U+FE0E forces text rendering; without it the dragons show as emoji.
        const TEXT = '︎';
        const GLYPHS = {
            '1m': '🀇', '2m': '🀈', '3m': '🀉', '4m': '🀊', '5m': '🀋',
            '6m': '🀌', '7m': '🀍', '8m': '🀎', '9m': '🀏',
            '1s': '🀐', '2s': '🀑', '3s': '🀒', '4s': '🀓', '5s': '🀔',
            '6s': '🀕', '7s': '🀖', '8s': '🀗', '9s': '🀘',
            '1p': '🀙', '2p': '🀚', '3p': '🀛', '4p': '🀜', '5p': '🀝',
            '6p': '🀞', '7p': '🀟', '8p': '🀠', '9p': '🀡',
            'E': '🀀', 'S': '🀁', 'W': '🀂', 'N': '🀃',
            'C': '🀄', 'F': '🀅', 'P': '🀆',
            // Red fives share the five's face and are coloured by CSS.
            '5mr': '🀋', '5pr': '🀝', '5sr': '🀔',
        };
        const WINDS = ['E', 'S', 'W', 'N'];
        const WIND_NAMES = { E: 'East', S: 'South', W: 'West', N: 'North' };

        function tileEl(tile, classes = []) {
            const el = document.createElement('span');
            el.className = ['tile', ...classes].join(' ');
            if (tile) {
                el.textContent = (GLYPHS[tile] || '?') + TEXT;
                if (tile.endsWith('r')) el.classList.add('red');
                el.title = tile;
            }
            return el;
        }

        class GameViewer {
            constructor() {
                this.ws = null;
                this.state = null;
                this.predictions = null;
                this.lastOutcome = null;
                this.watching = null;
                this.years = [];
                this.stepMode = true;
                this.paused = false;
                this.playing = new Map();

                this.connect();
                this.initPicker();
            }

            // --- connection -------------------------------------------------

            connect() {
                const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
                this.ws = new WebSocket(`${scheme}//${location.host}/ws`);
                this.ws.onopen = () => {
                    this.setStatus('connected', 'Connected');
                    if (this.watching) this.subscribe(this.watching);
                };
                this.ws.onmessage = (e) => this.onMessage(e);
                this.ws.onclose = () => {
                    this.setStatus('', 'Disconnected — retrying');
                    setTimeout(() => this.connect(), 3000);
                };
            }

            subscribe(gameId) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ action: 'subscribe', game_id: gameId }));
                }
            }

            setStatus(cls, text) {
                document.getElementById('dot').className = `dot ${cls}`;
                document.getElementById('connectionText').textContent = text;
            }

            onMessage(event) {
                let message;
                try { message = JSON.parse(event.data); } catch { return; }
                if (!message.event) return;

                if (message.observation) this.state = message.observation;
                if (message.recommendations) {
                    this.predictions = message.recommendations;
                    this.lastOutcome = null;
                }
                if (message.outcome) this.lastOutcome = message.outcome;

                this.lastEvent = message.event;
                document.getElementById('waiting').style.display = 'none';
                document.getElementById('gameStatusText').textContent =
                    `· ${message.game_id} · event ${message.event_index}`;

                this.render();
            }

            // --- rendering --------------------------------------------------

            render() {
                if (!this.state) return;
                for (let seat = 0; seat < 4; seat++) this.renderSeat(seat);
                this.renderCenter();
                this.renderHand();
                this.renderPredictions();
            }

            renderSeat(seat) {
                const el = document.getElementById(`seat-${seat}`);
                const player = this.state.players[seat];
                const acting = seat === this.state.observer;
                el.innerHTML = '';

                const plate = document.createElement('div');
                plate.className = `nameplate${acting ? ' acting' : ''}`;
                const wind = WINDS[(seat - this.state.dealer + 4) % 4];
                plate.innerHTML =
                    `<span class="seat-wind">${wind}</span>` +
                    `<span>${this.state.names[seat]}</span>` +
                    `<span class="score">${this.state.scores[seat]}</span>`;
                if (player.riichi === 'accepted') {
                    const stick = document.createElement('span');
                    stick.className = 'riichi-stick';
                    plate.appendChild(stick);
                }
                el.appendChild(plate);

                if (player.melds && player.melds.length) {
                    const melds = document.createElement('div');
                    melds.className = 'melds';
                    for (const meld of player.melds) {
                        const group = document.createElement('div');
                        group.className = 'meld';
                        for (const tile of meld.tiles) {
                            group.appendChild(tileEl(tile, ['called']));
                        }
                        melds.appendChild(group);
                    }
                    el.appendChild(melds);
                }

                const river = document.createElement('div');
                river.className = 'river';
                const discards = player.discards || [];
                discards.forEach((discard, index) => {
                    const classes = [];
                    if (discard.riichi) classes.push('sideways');
                    if (discard.called) classes.push('called');
                    if (index === discards.length - 1 && this.isLatestDiscard(seat)) {
                        classes.push('latest');
                    }
                    river.appendChild(tileEl(discard.tile, classes));
                });
                el.appendChild(river);
            }

            isLatestDiscard(seat) {
                return this.lastEvent
                    && this.lastEvent.type === 'dahai'
                    && this.lastEvent.actor === seat;
            }

            renderCenter() {
                const s = this.state;
                const el = document.getElementById('center');
                el.innerHTML = '';

                const box = document.createElement('div');
                box.className = 'round-box';
                const meta = [`${s.draws_remaining} left`];
                if (s.honba) meta.push(`${s.honba} honba`);
                if (s.kyotaku) meta.push(`${s.kyotaku} stick${s.kyotaku > 1 ? 's' : ''}`);
                box.innerHTML =
                    `<div class="round-name">${WIND_NAMES[s.bakaze] || s.bakaze} ${s.kyoku}</div>` +
                    `<div class="round-meta">${meta.join(' · ')}</div>`;
                el.appendChild(box);

                const dora = document.createElement('div');
                dora.className = 'dora-strip';
                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = 'Dora';
                dora.appendChild(label);
                for (const marker of s.dora_markers || []) dora.appendChild(tileEl(marker));
                el.appendChild(dora);
            }

            renderHand() {
                const panel = document.getElementById('handPanel');
                const hand = document.getElementById('hand');
                if (!this.state.own_hand) { panel.style.display = 'none'; return; }

                panel.style.display = '';
                document.getElementById('handOwner').textContent =
                    `${this.state.names[this.state.observer]} — the player to act`;

                hand.innerHTML = '';
                // Sort so the hand reads the way a player would hold it.
                const order = Object.keys(GLYPHS);
                const sorted = [...this.state.own_hand].sort(
                    (a, b) => order.indexOf(a) - order.indexOf(b)
                );
                for (const tile of sorted) hand.appendChild(tileEl(tile, ['lg']));

                if (this.state.own_last_draw) {
                    hand.appendChild(tileEl(this.state.own_last_draw, ['lg', 'drawn']));
                }
            }

            renderPredictions() {
                const el = document.getElementById('predictions');
                const outcome = document.getElementById('outcome');
                const actions = this.predictions && this.predictions.top_3_actions;

                if (!actions || !actions.length) {
                    el.innerHTML = '<div class="list-empty">Waiting for a draw…</div>';
                    outcome.textContent = '';
                    return;
                }

                el.innerHTML = '';
                for (const action of actions) {
                    const pct = (action.probability * 100).toFixed(1);
                    const chosen = this.lastOutcome
                        && this.lastOutcome.actual_tile === action.tile;

                    const row = document.createElement('div');
                    row.className = `prediction${chosen ? ' chosen' : ''}`;
                    row.appendChild(tileEl(action.tile));

                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    const fill = document.createElement('div');
                    fill.className = 'fill';
                    fill.style.width = `${pct}%`;
                    bar.appendChild(fill);
                    row.appendChild(bar);

                    const label = document.createElement('span');
                    label.className = 'pct';
                    label.textContent = `${pct}%`;
                    row.appendChild(label);

                    el.appendChild(row);
                }

                if (this.lastOutcome) {
                    const { rank, actual_tile } = this.lastOutcome;
                    outcome.textContent = rank
                        ? `Player discarded ${actual_tile} — the model's #${rank} pick.`
                        : `Player discarded ${actual_tile} — not in the model's top 3.`;
                } else {
                    outcome.textContent = '';
                }
            }

            // --- picker -----------------------------------------------------

            initPicker() {
                document.getElementById('yearSelect')
                    .addEventListener('change', (e) => this.refreshGames(e.target.value));

                const mode = document.getElementById('modeSelect');
                mode.addEventListener('change', () => {
                    const auto = mode.value === 'auto';
                    document.getElementById('speedSelect').style.display = auto ? '' : 'none';
                    document.getElementById('speedLabel').style.display = auto ? '' : 'none';
                });

                document.getElementById('nextBtn').addEventListener('click', () => this.step());
                document.getElementById('stopBtn').addEventListener('click', () => this.stop());
                document.getElementById('pauseBtn')
                    .addEventListener('click', () => this.togglePause());

                this.refreshGames();
                setInterval(() => this.refreshLive(), 4000);
            }

            async refreshGames(year) {
                try {
                    const url = year ? `/api/games?year=${encodeURIComponent(year)}` : '/api/games';
                    const data = await (await fetch(url)).json();

                    if (!this.years.length && data.years.length) {
                        this.years = data.years;
                        const select = document.getElementById('yearSelect');
                        select.innerHTML = data.years
                            .map((y) => `<option value="${y}">${y}</option>`).join('');
                        select.value = data.selected_year;
                    }
                    this.renderList('recordedList', data.recorded.map((id) => ({
                        game_id: id,
                        badge: (data.replaying || []).includes(id) ? 'playing' : null,
                    })), (id) => this.startReplay(id), 'No recorded games found');
                    this.renderLive(data.live);
                } catch (e) {
                    console.error('Could not load games:', e);
                }
            }

            async refreshLive() {
                try {
                    const data = await (await fetch('/api/games?limit=0')).json();
                    this.renderLive(data.live);
                } catch { /* transient */ }
            }

            renderLive(live) {
                this.playing = new Map((live || []).map((g) => [g.game_id, g]));
                this.renderList('liveList', (live || []).map((g) => ({
                    game_id: g.game_id,
                    badge: `${g.event_count} events`,
                })), (id) => this.joinLive(id), 'No games playing');
            }

            renderList(elementId, items, onClick, emptyText) {
                const el = document.getElementById(elementId);
                if (!items.length) {
                    el.innerHTML = `<div class="list-empty">${emptyText}</div>`;
                    return;
                }
                el.innerHTML = items.map((item) => `
                    <div class="game-item ${item.game_id === this.watching ? 'active' : ''}"
                         data-game="${item.game_id}">
                        <span>${item.game_id}</span>
                        ${item.badge ? `<span class="badge">${item.badge}</span>` : ''}
                    </div>`).join('');
                el.querySelectorAll('.game-item').forEach((node) => {
                    node.addEventListener('click', () => onClick(node.dataset.game));
                });
            }

            watch(gameId) {
                this.watching = gameId;
                this.state = null;
                this.predictions = null;
                this.lastOutcome = null;
                this.subscribe(gameId);
                document.querySelectorAll('.game-item').forEach((node) => {
                    node.classList.toggle('active', node.dataset.game === gameId);
                });
            }

            joinLive(gameId) {
                if (gameId === this.watching) return;
                this.watch(gameId);
                const game = this.playing && this.playing.get(gameId);
                if (game) {
                    this.showTransport(game.step_mode);
                } else {
                    this.hideTransport();
                }
            }

            async startReplay(gameId) {
                const speed = parseFloat(document.getElementById('speedSelect').value);
                const stepMode = document.getElementById('modeSelect').value === 'step';
                this.watch(gameId);
                document.getElementById('waiting').style.display = '';
                document.getElementById('waiting').textContent = 'Starting…';

                try {
                    const res = await fetch('/api/watch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game_id: gameId, speed, step_mode: stepMode }),
                    });
                    if (!res.ok) {
                        document.getElementById('waiting').textContent = 'Could not start that game.';
                        return;
                    }
                    this.showTransport(stepMode);
                    document.getElementById('waiting').textContent = stepMode
                        ? 'Click Next event to play the first move.'
                        : 'Playing…';
                } catch {
                    document.getElementById('waiting').textContent = 'Could not reach the server.';
                }
            }

            // --- transport --------------------------------------------------

            showTransport(stepMode) {
                this.stepMode = stepMode;
                this.paused = false;
                document.getElementById('transport').style.display = '';
                document.getElementById('nextBtn').style.display = stepMode ? '' : 'none';
                document.getElementById('pauseBtn').style.display = stepMode ? 'none' : '';
                document.getElementById('pauseBtn').textContent = 'Pause';
            }

            hideTransport() {
                document.getElementById('transport').style.display = 'none';
            }

            async control(path) {
                if (!this.watching) return null;
                try {
                    const res = await fetch(path, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game_id: this.watching }),
                    });
                    return res.ok ? res : null;
                } catch { return null; }
            }

            async step() {
                const btn = document.getElementById('nextBtn');
                btn.disabled = true;
                const res = await this.control('/api/step');
                if (!res) {
                    this.hideTransport();
                    return;
                }
                setTimeout(() => { btn.disabled = false; }, 250);
            }

            async togglePause() {
                const res = await this.control(this.paused ? '/api/resume' : '/api/pause');
                if (!res) return;
                this.paused = !this.paused;
                document.getElementById('pauseBtn').textContent =
                    this.paused ? 'Resume' : 'Pause';
            }

            async stop() {
                await this.control('/api/stop');
                this.hideTransport();
                document.getElementById('waiting').style.display = '';
                document.getElementById('waiting').textContent = 'Stopped. Pick another game.';
                this.refreshGames(document.getElementById('yearSelect').value);
            }
        }

        document.addEventListener('DOMContentLoaded', () => new GameViewer());
    </script>
</body>
</html>
