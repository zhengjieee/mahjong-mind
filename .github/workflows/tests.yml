name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GCP_PROJECT: project-d62b6639-d6d0-430b-98b
  GCP_REGION: asia-southeast1
  SERVICE: mahjong-mind
  SERVICE_URL: https://mahjong-mind-908350631195.asia-southeast1.run.app

jobs:
  tests:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          python -m pip install
          fastapi==0.115.6
          httpx
          kafka-python==3.0.11
          mahjong==2.0.0
          mypy==2.3.0
          pyarrow==25.0.1
          pydantic==2.13.4
          pytest==9.1.1
          ruff==0.16.2
          uvicorn==0.52.1
          websockets==17.0.1

      - name: Install PyTorch (CPU-only)
        run: >-
          python -m pip install torch==2.13.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run mypy
        run: python -m mypy src tests

  deploy:
    name: deploy
    # Only a green main reaches production; a pull request stops at the tests.
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Required to mint the OIDC token that stands in for a stored key.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload identity federation: GitHub's own OIDC token is exchanged
          # for short-lived credentials, so no service-account key is stored.
          workload_identity_provider: projects/908350631195/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@project-d62b6639-d6d0-430b-98b.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.SERVICE }}/service:${{ github.sha }}
          # GitHub's runners are amd64, so this needs no --platform flag; a
          # local build on an arm64 Mac does.
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="$IMAGE" \
            --region=${{ env.GCP_REGION }} \
            --quiet

      - name: Health check the deployed revision
        run: |
          # A deploy that reports success but serves errors is still a failed
          # deploy, so the workflow only goes green once the service answers.
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 30 "${{ env.SERVICE_URL }}/health" | grep -q '"ok"'; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 6
          done
          echo "service did not become healthy" >&2
          exit 1
